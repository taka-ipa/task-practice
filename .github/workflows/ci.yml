name: CI

on:
  push:
    branches: [main]
  pull_request:

# デフォルトのGITHUB_TOKENは読み取り専用にする（侵害時の被害を最小化）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# アクションはコミットSHAで固定している（タグの付け替えによるサプライチェーン攻撃対策）。
# 末尾のコメントのバージョンとあわせてDependabotが更新する。
jobs:
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --progress=false

      # 既存コードにlintエラーが残っているため、今は失敗してもCI全体は落とさず警告にとどめる。
      # エラーを解消したら `|| echo ...` を外して必須チェックにする。
      - name: lint (non-blocking)
        run: npm run lint || echo "::warning title=eslint::lintエラーが残っています（現在は非ブロッキング）"

      - run: npm run build

  backend:
    name: backend (phpunit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4" # 本番(backend/Dockerfile)に合わせる
          extensions: mbstring, pdo_sqlite, sqlite3, zip, dom, xml, ctype, fileinfo, tokenizer, openssl
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # phpunit.xml でSQLiteインメモリDBを使うため、外部サービスは不要
      - run: php artisan test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DependabotのベースイメージPR（Dockerfileのみ変更）が壊れていないかを検証する
      - name: build frontend image
        run: docker build -t task-frontend:ci ./frontend

      - name: build backend image
        run: docker build -t task-backend:ci ./backend
