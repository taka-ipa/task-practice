name: Audit

# 依存パッケージの既知の脆弱性チェック。
# 毎日実行して、PRが無くても新しいアドバイザリを検知する（失敗すると通知が届く）。
on:
  schedule:
    - cron: "0 0 * * *" # 毎日 09:00 JST
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/composer.json"
      - "backend/composer.lock"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend, production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # 本番に入る依存のみ対象。devDependencies(eslint系)の既知の指摘は対象外
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  composer-audit:
    name: composer audit (backend, production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      # 放棄(abandoned)パッケージは報告のみ。脆弱性アドバイザリがあるときだけ失敗させる
      - run: composer audit --locked --no-dev
        working-directory: backend
        env:
          COMPOSER_AUDIT_ABANDONED: report
